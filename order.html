<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-content">
        <div class="order-container">
            <h1>Eldobrew Online Order</h1>
            <form>
                <div class="form-order">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name">
                </div>
                <div class="form-order">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-order">
                    <label for="drink">Choose your drink:</label>
                    <select id="drink" name="drink">
                        <option value="">Select</option>
                        <option value="coffee">Coffee</option>
                        <option value="latte">Latte</option>
                        <option value="cappuccino">Cappuccino</option>
                        <option value="espresso">Espresso</option>
                        <option value="mocha">Mocha</option>
                        <option value="tea">Tea</option>
                    </select>
                </div>
                <div class="form-order">
                    <label for="size">Size:</label>
                    <select id="size" name="size">
                        <option value="medium">Medium</option>
                        <option value="small">Small</option>
                        <option value="large">Large</option>
                    </select>
                </div>
                <fieldset class="extras">
                    <legend>Extras:</legend>
                    <div class="extra-item">
                        <label for="shot">Extra Shot</label>
                        <input type="checkbox" id="shot" name="extras" value="extra-shot">
                    </div>
                    <div class="extra-item">
                        <label for="soy">Soy Milk</label>
                        <input type="checkbox" id="soy" name="extras" value="soy-milk">
                    </div>
                    <div class="extra-item">
                        <label for="vanilla">Vanilla Syrup</label>
                        <input type="checkbox" id="vanilla" name="extras" value="vanilla">
                    </div>
                    <div class="extra-item">
                        <label for="caramel">Caramel Syrup</label>
                        <input type="checkbox" id="caramel" name="extras" value="caramel">
                    </div>
                </fieldset>
                <div class="form-order">
                    <label for="instructions">Special Instructions:</label>
                    <textarea
                        id="instructions"
                        name="instructions"
                        rows="4"
                        placeholder="Any special requests?">
                    </textarea>
                </div>
                <button type="submit" class="order">Place Order</button>
            </form>
        </div>
    </main>
   <script>
const nameInput = document.getElementById('name');
nameInput.addEventListener('input', function () {
    this.value = this.value.replace(/[0-9]/g, '');
});

document.querySelector('form').addEventListener('submit', function (e) {
    e.preventDefault();

    const name = nameInput.value.trim();
    const email = document.getElementById('email').value.trim();
    const drink = document.getElementById('drink').value;
    const size = document.getElementById('size').value;
    const instructions = document.getElementById('instructions').value.trim();

    if (!name) {
        alert('Please enter your name.');
        return;
    }
    const namePattern = /^[A-Za-z\s'-]+$/;
    if (!namePattern.test(name)) {
        alert('Name cannot contain numbers or special characters.');
        return;
    }
    const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailPattern.test(email)) {
        alert('Please enter a valid email address.');
        return;
    }
    if (!drink) {
        alert('Please choose a drink.');
        return;
    }

    const extrasLabels = {
        'extra-shot': 'Extra Shot',
        'soy-milk': 'Soy Milk',
        'vanilla': 'Vanilla Syrup',
        'caramel': 'Caramel Syrup'
    };
    const extrasList = Array.from(
        document.querySelectorAll('input[name="extras"]:checked')
    ).map(el => extrasLabels[el.value] || el.value);

    let summary = `Thanks, ${name}! Your order:\n`;
    summary += `${size.charAt(0).toUpperCase() + size.slice(1)} ${drink}\n`;
    if (extrasList.length) summary += `Extras: ${extrasList.join(', ')}\n`;
    if (instructions) summary += `Notes: ${instructions}\n`;
    summary += `\nA confirmation will be sent to ${email}.`;

    alert(summary);

    this.reset();
});
</script>
</body>
</html>
